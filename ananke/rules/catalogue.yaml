- id: R1
  title: "Post-mission orbital life below 5 years, or controlled re-entry"
  source: {doc: "ISRO DFSM (19 Apr 2024)", clause: "Guideline 4"}
  type: hard
  metric: lifetime_worst_after_disposal
  limit: {op: "<", value: 5.0}
  warn_if: {metric: lifetime_nominal_after_disposal, op: "<", value: 5.0}

- id: R2
  title: "Post-mission disposal success probability above 99%"
  source: {doc: "ISRO DFSM (19 Apr 2024)", clause: "Guideline 4"}
  type: hard
  metric: p_pmd
  limit: {op: ">", value: 0.99}

- id: R3
  title: "Avoid transfers or disposal in the 370-430 km human-spaceflight band"
  source: {doc: "ISRO DFSM (19 Apr 2024)", clause: "Human spaceflight band"}
  type: hard
  metric: band_crossing_flag
  limit: {op: "<", value: 0.5}

- id: R5
  title: "Propellant budgeted for disposal, with margin"
  source: {doc: "ISRO DFSM (19 Apr 2024)", clause: "Guideline 4 / fuel budgeting"}
  type: hard
  metric: fuel_margin_kg
  limit: {op: ">=", value: 0.0}

- id: R9
  title: "Expected casualties from planned re-entry below 1 in 10,000"
  source: {doc: "IN-SPACe Planned Re-entry NGP (Jul 2026)", clause: "Risk limit"}
  type: hard
  metric: ec_total
  limit: {op: "<", value: 1.0e-4}
